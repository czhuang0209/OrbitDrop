name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Package
        shell: pwsh
        run: ./build/package.ps1 -Version ("${{ github.ref_name }}".TrimStart('v'))

      # Published straight away so the README's download links work. Tags with a "-" (e.g. v0.1.0-alpha)
      # are marked as pre-releases, so nothing unfinished is ever presented as a stable release.
      - uses: softprops/action-gh-release@v2
        with:
          name: OrbitDrop ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: build/release-notes.md
          files: |
            artifacts/OrbitDrop-Setup.exe
            artifacts/OrbitDrop-Portable.zip
            artifacts/SHA256SUMS.txt

      # The README's Installer / portable links name a release (pre-releases have no "latest" link): point them at
      # this one, so the README never hands out an old version.
      - name: Point the README's downloads at this release
        shell: pwsh
        run: |
          git fetch origin main
          git checkout -B main origin/main
          $tag = "${{ github.ref_name }}"
          $readme = Get-Content README.md -Raw
          $updated = $readme -replace 'releases/download/v[^/]+/', "releases/download/$tag/" -replace '\*\*Status: [^*]+\.\*\*', "**Status: $($tag.TrimStart('v')).**"
          if ($updated -ne $readme) {
            Set-Content README.md $updated -NoNewline
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "README: downloads point to $tag"
            git push origin main
          }
